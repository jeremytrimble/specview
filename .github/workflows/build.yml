name: Build Specview Executables

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-20.04, windows-latest, macos-latest]
steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --user uv
          uv sync --group build --group dev
          uv pip install -e .

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller --clean  specview.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: specview-${{ runner.os }}
          path: |
            dist/main.exe
            dist/main
