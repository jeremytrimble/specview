[project]
name = "pyqtschema"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.25.1",
    "pydantic>=2.12.5",
    "qtpy>=2.4.3",
]

[dependency-groups]
dev = [
    "pyqtschema",
    "pytest>=9.0.2",
    "pytest-qt>=4.5.0",
    # Testing requires one of pyqt5, pyqt6, pyside5 or pyside6
    # These would normally be determined by the application that uses this library.
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
pyqtschema = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

