[project]
name = "specview"
version = "0.2.0"
description = "GUI viewer for SigMF RF signal recordings with spectrum, waterfall, and time-domain displays"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Jeremy Trimble" },
]
keywords = ["sigmf", "spectrum", "waterfall", "rf", "sdr", "signal", "radio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "jsonschema>=4.24.0",
    "numpy>=2.3.1",
    "platformdirs>=4.3.8",
    "pydantic>=2.11.7",
    "pyqt6>=6.7.0",
    "pyqtgraph>=0.13.7",
    "qtpy>=2.4.3",
    "scipy>=1.16.0",
    "sigmf>=1.11.0,<1.12.0",
]

[project.urls]
Homepage = "https://github.com/jeremytrimble/specview"
"Bug Tracker" = "https://github.com/jeremytrimble/specview/issues"
Changelog = "https://github.com/jeremytrimble/specview/blob/main/CHANGELOG.md"

[dependency-groups]
build = [
    "pyinstaller>=6.16.0",
    "specview",
]
dev = [
    "pytest>=8.4.1",
    "mypy>=1.18.2",
    "pytest-cov>=7.0.0",
    "specview",
    "pytest-qt>=4.5.0",
    "poethepoet>=0.31.1",
    "ruff>=0.8.4",
]

[project.gui-scripts]
specview = "specview.main:main"


[tool.uv.sources]
specview = { workspace = true }
pyqtschema = { workspace = true }

[tool.pytest.ini_options]
addopts = "--cov=src/specview --cov-report=term --cov-report=html"
testpaths = [
    "tests"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
specview = "src/specview"
pyqtschema = "subs/pyqtschema/src/pyqtschema"

# TODO: make the build backend generate the version info for a wheel file

[tool.poe.tasks]
test = "pytest tests/"
build-wheel = "uv build"
build-pyinstaller = "pyinstaller --clean specview.spec"
build = ["build-wheel", "build-pyinstaller"]
clean.script = "poethepoet.scripts:rm('dist/', 'build/')"
format = "ruff format ."
format-check = "ruff format --check ."
