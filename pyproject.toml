[project]
name = "specview"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.24.0",
    "numpy>=2.3.1",
    "platformdirs>=4.3.8",
    "pydantic>=2.11.7",
    "pyqt6>=6.7.0",
    "pyqtgraph>=0.13.7",
    "qtpy>=2.4.3",
    "scipy>=1.16.0",
    "sigmf>=1.2.10",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16.0",
    "specview",
]
dev = [
    "pytest>=8.4.1",
    "mypy>=1.18.2",
    "pytest-cov>=7.0.0",
    "specview",
    "pytest-qt>=4.5.0",
    "poethepoet>=0.31.1",
    "pillow>=11.0.0",
    "ruff>=0.8.4",
]

[project.gui-scripts]
specview = "specview.main:main"


[tool.uv.sources]
specview = { workspace = true }
pyqtschema = { workspace = true }

[tool.pytest.ini_options]
addopts = "--cov=src/specview --cov-report=term --cov-report=html"
testpaths = [
    "tests"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
specview = "src/specview"
pyqtschema = "subs/pyqtschema/src/pyqtschema"

[tool.setuptools.package-data]
specview = ["assets/*"]

# TODO: make the build backend generate the version info for a wheel file

[tool.poe.tasks]
test = "pytest tests/"
build-wheel = "uv build"
build-pyinstaller = "pyinstaller --clean specview.spec"
build = ["build-wheel", "build-pyinstaller"]
clean.script = "poethepoet.scripts:rm('dist/', 'build/')"
make-icons = "python scripts/make_app_icon.py --input specview_lg.png --assets-dir src/specview/assets --name specview"
format = "ruff format ."
format-check = "ruff format --check ."
