[project]
name = "specview"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "diskcache>=5.6.3",
    "numpy>=2.3.1",
    "pandas>=2.3.1",
    "platformdirs>=4.3.8",
    "pydantic>=2.11.7",
    "pyqt5>=5.15.11",
    "pyqtgraph>=0.13.7",
    "pyqtschema>=0.2.0",
    "pytest>=8.4.1",
    "scipy>=1.16.0",
    "sigmf>=1.2.10",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16.0",
    "specview",
]
dev = [
    "mypy>=1.18.2",
    "pytest-cov>=7.0.0",
    "specview",
]

[tool.uv.sources]
specview = { workspace = true }

[tool.pytest.ini_options]
addopts = "--cov=src/specview --cov-report=term --cov-report=html"
testpaths = [
    "tests"
]
